# Host Nginx — danzykicks.com (Cloudflare + Docker on Hostinger VPS)
#
# Install:
#   sudo cp deploy/nginx/danzykicks.com.conf /etc/nginx/sites-available/danzykicks.com
#   sudo ln -sf /etc/nginx/sites-available/danzykicks.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: Cloudflare Origin Certificate (dashboard → SSL/TLS → Origin Server).
# Store cert/key on the server only — never commit them.

# Real client IP from Cloudflare (no need to maintain Cloudflare IP ranges)
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name danzykicks.com www.danzykicks.com api.danzykicks.com;
    return 301 https://$host$request_uri;
}

# Storefront + admin UI (React SPA in Docker)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danzykicks.com www.danzykicks.com;

    ssl_certificate     /etc/ssl/cloudflare/danzykicks.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/danzykicks.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# REST API (Flask + Gunicorn in Docker)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.danzykicks.com;

    ssl_certificate     /etc/ssl/cloudflare/danzykicks.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/danzykicks.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
